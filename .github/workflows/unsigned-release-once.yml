name: Unsigned Release Bootstrap

on:
  push:
    paths:
      - '.github/workflows/unsigned-release-once.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build unsigned release APK
        run: gradle assembleRelease --stacktrace
      - name: Locate release APK
        run: |
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print
      - uses: actions/upload-artifact@v4
        with:
          name: Lotto642ModelTracker-v1.0.1-UNSIGNED-RELEASE
          path: app/build/outputs/apk/release/*.apk
          retention-days: 1
