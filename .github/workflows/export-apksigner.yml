name: Export Android apksigner

on:
  push:
    paths:
      - '.github/workflows/export-apksigner.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Locate Android apksigner
        run: |
          TOOL=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$TOOL" || (echo "::error::apksigner not found" && exit 1)
          DIR=$(dirname "$TOOL")
          mkdir -p "$RUNNER_TEMP/apksigner-tool"
          cp "$TOOL" "$RUNNER_TEMP/apksigner-tool/apksigner"
          cp -R "$DIR/lib" "$RUNNER_TEMP/apksigner-tool/lib"
          "$TOOL" --version

      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: ${{ runner.temp }}/apksigner-tool
          retention-days: 1
